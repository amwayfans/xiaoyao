<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小妖健管 - 每週身體數據登記表</title>
  
  <!-- 🌸 引入 LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --primary-color: #9f1239;
      --secondary-color: #fecdd3;
      --bg-color: #fcf6f7;
      --card-bg: #ffffff;
      --text-color: #4a282e;
    }
    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-color);
    }
    .container {
      max-width: 650px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 20px;
      border: 2px solid #f3d2d9;
      box-shadow: 0 10px 25px rgba(181, 131, 141, 0.15);
      padding: 24px;
      position: relative;
    }
    .header {
      text-align: center;
      padding-bottom: 16px;
      border-bottom: 2px dashed var(--secondary-color);
    }
    .header h1 {
      margin: 0;
      font-size: 22px;
      color: var(--primary-color);
    }
    .header p {
      margin: 6px 0 0;
      font-size: 13px;
      color: #881337;
    }
    .form-group {
      margin-top: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #881337;
      margin-bottom: 6px;
    }
    select, input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #fecdd3;
      border-radius: 12px;
      box-sizing: border-box;
      font-size: 14px;
      outline: none;
      background-color: #fff8f9;
    }
    select:focus, input:focus, textarea:focus {
      border-color: var(--primary-color);
      background-color: #ffffff;
    }
    input[readonly], input[disabled], select[disabled], textarea[disabled] {
      background-color: #f3f4f6 !important;
      color: #6b7280;
      border-color: #e5e7eb;
      cursor: not-allowed;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .cycle-card {
      background: linear-gradient(135deg, #fff0f3 0%, #ffeef2 100%);
      border: 1.5px solid #fecdd3;
      border-radius: 14px;
      padding: 12px 16px;
      margin-top: 16px;
      font-size: 13px;
    }
    .cycle-card div {
      margin-bottom: 4px;
    }
    .alert-banner {
      background-color: #fef3c7;
      border: 1px solid #f59e0b;
      color: #92400e;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
    .btn-submit {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: linear-gradient(135deg, #881337 0%, #9f1239 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(159, 18, 57, 0.25);
      transition: all 0.2s ease;
    }
    .btn-submit:disabled {
      background: #ccc;
      cursor: not-allowed;
      box-shadow: none;
    }
    /* 🌸 IMPROVE: 管理員按鈕樣式 */
    .admin-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }
    .btn-admin-add {
      background: linear-gradient(135deg, #be123c 0%, #fb7185 100%);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(190, 18, 60, 0.3);
      display: none; /* 預設隱藏，管理員才顯示 */
      transition: transform 0.2s;
    }
    .btn-admin-add:hover {
      transform: scale(1.02);
    }
    /* 🌸 IMPROVE: Modal 對話框樣式 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 16px;
    }
    .modal-content {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      border: 2px solid #f3d2d9;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      font-size: 18px;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1.5px dashed #fecdd3;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-close {
      cursor: pointer;
      font-size: 20px;
      color: #9f1239;
    }
    .table-container {
      margin-top: 24px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: center;
    }
    th, td {
      border: 1px solid #fecdd3;
      padding: 8px 4px;
    }
    th {
      background-color: #fff0f3;
      color: var(--primary-color);
    }
    .status-msg {
      text-align: center;
      margin-top: 10px;
      font-size: 13px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- 🌸 IMPROVE: 管理員專用建立期程按鈕區 -->
  <div class="admin-bar">
    <button type="button" class="btn-admin-add" id="btnAdminAdd" onclick="openAdminModal()">➕ 建立新學員健管期程</button>
  </div>

  <div class="header">
    <h1>🌸 小妖健管每週數據登記</h1>
    <p>記錄每週變化，看見更好的自己✨</p>
  </div>

  <!-- 學員選擇區 -->
  <div class="form-group">
    <label for="studentSelect">👤 選擇紀錄學員：</label>
    <select id="studentSelect" onchange="onStudentChange()">
      <option value="">載入中...</option>
    </select>
  </div>

  <!-- 期程狀態卡片 -->
  <div class="cycle-card" id="cycleCard">
    <div><strong>健管期程：</strong><span id="cycleIdText">載入中...</span></div>
    <div><strong>當前期數：</strong>第 <span id="cycleNumText">-</span> 期 (依記錄日期計算為：第 <span id="currentWeekText">-</span> 週)</div>
  </div>

  <!-- 覆蓋提示 Banner -->
  <div class="alert-banner" id="existingAlert">
    💡 提示：本週（或該日期對應週數）已有量測紀錄，再次儲存將會更新覆蓋既有數據。
  </div>

  <!-- 輸入表單 -->
  <form id="healthForm" onsubmit="submitForm(event)">
    
    <!-- 紀錄日期選擇器 -->
    <div class="form-group">
      <label for="recordDate">📅 紀錄日期 *：</label>
      <input type="date" id="recordDate" required onchange="onDateOrValueChange()">
    </div>

    <div class="form-group grid-2">
      <div>
        <label for="height">身高 (cm) *：</label>
        <input type="number" id="height" step="0.1" required placeholder="例如 165" oninput="calculateBMI()">
      </div>
      <div>
        <label for="weight">體重 (kg) *：</label>
        <input type="number" id="weight" step="0.1" required placeholder="0.0" oninput="calculateBMI()">
      </div>
    </div>

    <!-- 自動計算 BMI (唯讀) -->
    <div class="form-group grid-2">
      <div>
        <label for="bmi">BMI (自動計算) ：</label>
        <input type="text" id="bmi" readonly disabled placeholder="填寫身高體重後自動計算">
      </div>
      <div>
        <label for="bodyFat">體脂率 (%) *：</label>
        <input type="number" id="bodyFat" step="0.1" required placeholder="0.0">
      </div>
    </div>

    <div class="form-group grid-2">
      <div>
        <label for="skeletalMuscle">骨骼肌率 (%) *：</label>
        <input type="number" id="skeletalMuscle" step="0.1" required placeholder="0.0">
      </div>
      <div>
        <label for="visceralFat">內臟脂肪等級 *：</label>
        <input type="number" id="visceralFat" step="0.5" required placeholder="例如 3">
      </div>
    </div>

    <div class="form-group grid-2">
      <div>
        <label for="bmr">基礎代謝 (kcal) *：</label>
        <input type="number" id="bmr" required placeholder="例如 1200">
      </div>
      <div>
        <label for="bodyAge">身體年齡 *：</label>
        <input type="number" id="bodyAge" required placeholder="例如 25">
      </div>
    </div>

    <div class="form-group grid-2">
      <div>
        <label for="waist">腰圍 (cm)：</label>
        <input type="number" id="waist" step="0.1" placeholder="可留空" oninput="calculateWHR()">
      </div>
      <div>
        <label for="hip">臀圍 (cm)：</label>
        <input type="number" id="hip" step="0.1" placeholder="可留空" oninput="calculateWHR()">
      </div>
    </div>

    <!-- 自動計算 腰臀比 (唯讀) -->
    <div class="form-group">
      <label for="whr">腰臀比 (腰圍 / 臀圍)：</label>
      <input type="text" id="whr" readonly disabled placeholder="-">
    </div>

    <!-- 備註欄位 -->
    <div class="form-group">
      <label for="memo">當週身體狀況與備註：</label>
      <textarea id="memo" rows="4" placeholder="例如：飲食正常、運動狀況、生理期等注意事項..."></textarea>
    </div>

    <button type="submit" class="btn-submit" id="btnSubmit">儲存當週數據 🌸</button>
  </form>

  <div class="status-msg" id="statusMsg"></div>

  <!-- 歷史數據列表 -->
  <div class="table-container" id="historySection">
    <label>📊 本期歷史記錄列表：</label>
    <table>
      <thead>
        <tr>
          <th>週數</th>
          <th>日期</th>
          <th>體重</th>
          <th>BMI</th>
          <th>體脂</th>
          <th>肌肉</th>
          <th>腰臀比</th>
        </tr>
      </thead>
      <tbody id="historyTableBody">
        <tr><td colspan="7">暫無歷史紀錄</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 🌸 IMPROVE: 管理員專用建立新學員健管期程 Modal 視窗 -->
<div class="modal-overlay" id="adminModal" onclick="closeAdminModalOnOverlay(event)">
  <div class="modal-content">
    <div class="modal-header">
      <span>🌸 建立新學員健管期程</span>
      <span class="modal-close" onclick="closeAdminModal()">✖</span>
    </div>
    <form id="adminCycleForm" onsubmit="submitAdminCreateCycle(event)">
      <div class="form-group">
        <label for="modalStudentSelect">👤 選擇目標學員 *：</label>
        <select id="modalStudentSelect" required>
          <option value="">載入中...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="modalCoachSelect">身分指派：負責教練 *：</label>
        <select id="modalCoachSelect" required>
          <option value="">載入中...</option>
        </select>
      </div>

      <div class="form-group grid-2">
        <div>
          <label for="modalStartDate">開始日期 *：</label>
          <input type="date" id="modalStartDate" required onchange="autoCalcEndDate()">
        </div>
        <div>
          <label for="modalEndDate">結束日期 (自動+45天) *：</label>
          <input type="date" id="modalEndDate" required>
        </div>
      </div>

      <div class="form-group grid-2">
        <div>
          <label for="modalTargetWeight">目標體重 (kg)：</label>
          <input type="number" id="modalTargetWeight" step="0.1" placeholder="選填">
        </div>
        <div>
          <label for="modalTargetBodyFat">目標體脂率 (%)：</label>
          <input type="number" id="modalTargetBodyFat" step="0.1" placeholder="選填">
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnAdminSubmit" style="margin-top: 16px;">開通新健管期程 🌸</button>
      <div class="status-msg" id="modalStatusMsg"></div>
    </form>
  </div>
</div>

<script>
  // 🌸 LIFF ID
  const LIFF_ID = "2011036080-f1uDP48f"; 

  // GAS Web App URL
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw4SepToEB3DoVPutFIX183Cine0GxYJVquDh8119eRDpPlpXLvFY_cT-DReGA91sxY/exec"; 

  let operatorId = ""; // 動態取得的操作者 Line ID
  let operatorRole = "學員"; // 🌸 IMPROVE: 保存操作者角色 (系統管理員/教練/學員)
  let currentCycleData = null;
  let currentRecords = [];

  window.onload = async function() {
    const todayStr = new Date().toISOString().split('T')[0];
    document.getElementById("recordDate").value = todayStr;
    
    // 初始化 LIFF 並載入學員清單
    await initLiff();
    loadStudentList();
  };

  // 🌸 IMPROVE: LIFF 初始化並辨識管理員權限
  async function initLiff() {
    document.getElementById("statusMsg").innerText = "身分驗證中...";
    
    const urlParams = new URLSearchParams(window.location.search);
    const paramOperatorId = urlParams.get('operator_id');
    if (paramOperatorId) {
      operatorId = paramOperatorId;
      console.log("已從 URL 參數取得 operator_id:", operatorId);
      document.getElementById("statusMsg").innerText = "";
      return;
    }

    try {
      await liff.init({ liffId: LIFF_ID });
      
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        operatorId = profile.userId;
        console.log("成功從 LIFF 取得 Line ID:", operatorId);
        document.getElementById("statusMsg").innerText = "";
      } else {
        liff.login();
      }
    } catch (err) {
      console.warn("LIFF 初始化未成功（非 LINE 內建瀏覽器環境）：", err);
      operatorId = operatorId || "U1234567890";
      document.getElementById("statusMsg").innerText = "";
    }
  }

  // 🌸 IMPROVE: 讀取學員清單並判定操作者角色，若為管理員則顯示建立按鈕
  function loadStudentList(autoSelectUserId) {
    if (!operatorId) return;

    fetch(GAS_WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ action: "get_student_list", operator_id: operatorId })
    })
    .then(res => res.json())
    .then(res => {
      const select = document.getElementById("studentSelect");
      select.innerHTML = "";
      
      if (res.success) {
        // 紀錄角色身分
        operatorRole = res.role || "學員";
        
        // 若為系統管理員，顯示開通按鈕
        if (operatorRole === "系統管理員") {
          document.getElementById("btnAdminAdd").style.display = "block";
        } else {
          document.getElementById("btnAdminAdd").style.display = "none";
        }

        if (res.data && res.data.length > 0) {
          res.data.forEach(s => {
            const opt = document.createElement("option");
            opt.value = s.LineID;
            // 標註狀態顯示
            opt.textContent = s.statusText ? `${s.name} (${s.statusText})` : s.name;
            select.appendChild(opt);
          });

          if (autoSelectUserId) {
            select.value = autoSelectUserId;
          }

          onStudentChange();
        } else {
          select.innerHTML = `<option value="">無學員資料</option>`;
          setFormDisabled(true);
          document.getElementById("statusMsg").innerText = "目前無可選取的學員。";
        }
      }
    })
    .catch(err => {
      console.error(err);
      alert("載入學員清單失敗，請稍後重試");
    });
  }

  // 🌸 IMPROVE: 切換學員時檢查「健管狀態」，若非健管中跳出 alert 提示並鎖定表單
  function onStudentChange() {
    const selectedUserId = document.getElementById("studentSelect").value;
    if (!selectedUserId) return;

    document.getElementById("statusMsg").innerText = "驗證學員健管狀態中...";

    // 先調用 API 驗證學員是否有「健管中」狀態
    fetch(GAS_WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ action: "check_health_status", user_id: selectedUserId })
    })
    .then(res => res.json())
    .then(res => {
      if (res.success && res.isActive) {
        // 有進行中期程：解鎖表單並載入紀錄
        setFormDisabled(false);
        fetchCycleRecords(selectedUserId);
      } else {
        // 🌸 無進行中期程：清空資料、跳出明確 Alert 通告並鎖定表單
        setFormDisabled(true);
        document.getElementById("cycleIdText").innerText = "非健管中";
        document.getElementById("cycleNumText").innerText = "-";
        document.getElementById("currentWeekText").innerText = "-";
        document.getElementById("historyTableBody").innerHTML = '<tr><td colspan="7">該學員目前非健管中狀態，無進行中期程資料</td></tr>';
        document.getElementById("statusMsg").innerText = "⚠️ 此學員目前並非健管中狀態，請聯繫教練協助開通健管期程唷！🌸";

        alert("此學員目前並非健管中狀態，請聯繫教練協助開通健管期程唷！🌸");
      }
    })
    .catch(err => {
      console.error(err);
      document.getElementById("statusMsg").innerText = "檢查健管狀態失敗";
    });
  }

  // 🌸 IMPROVE: 讀取期程紀錄 details
  function fetchCycleRecords(userId) {
    document.getElementById("statusMsg").innerText = "載入學員期程與資料中...";
    fetch(GAS_WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ action: "get_cycle_records", user_id: userId })
    })
    .then(res => res.json())
    .then(res => {
      document.getElementById("statusMsg").innerText = "";
      if (res.success && res.cycle) {
        currentCycleData = res.cycle;
        currentRecords = res.records || [];

        document.getElementById("cycleIdText").innerText = res.cycle.cycleId;
        document.getElementById("cycleNumText").innerText = res.cycle.cycleNumber;

        if (res.userHeight) {
          document.getElementById("height").value = res.userHeight;
        } else {
          document.getElementById("height").value = "";
        }

        calculateBMI();
        calculateWHR();
        checkWeekAndAlert();
        renderHistoryTable(currentRecords);
      }
    });
  }

  // 🌸 IMPROVE: 控制表單輸入欄位與按鈕啟用/停用
  function setFormDisabled(disabled) {
    const formInputs = document.querySelectorAll("#healthForm input, #healthForm textarea");
    formInputs.forEach(input => {
      if (input.id !== "bmi" && input.id !== "whr") {
        input.disabled = disabled;
      }
    });
    document.getElementById("btnSubmit").disabled = disabled;
  }

  function onDateOrValueChange() {
    checkWeekAndAlert();
  }

  function checkWeekAndAlert() {
    if (!currentCycleData) return;

    const recordDateVal = document.getElementById("recordDate").value;
    if (!recordDateVal) return;

    const recDate = new Date(recordDateVal.replace(/-/g, '/'));
    const start = new Date(currentCycleData.startDate);
    
    const diffMs = recDate.getTime() - start.getTime();
    const diffDays = Math.floor(diffMs / (24 * 60 * 60 * 1000));
    let week = Math.floor(diffDays / 7) + 1;
    if (week < 1) week = 1; 
    if (week > 7) week = 7;

    document.getElementById("currentWeekText").innerText = week;

    const existing = currentRecords.find(r => Number(r.weekNumber) === Number(week));
    const alertBanner = document.getElementById("existingAlert");
    if (existing) {
      alertBanner.style.display = "block";
    } else {
      alertBanner.style.display = "none";
    }
  }

  function calculateBMI() {
    const h = parseFloat(document.getElementById("height").value);
    const w = parseFloat(document.getElementById("weight").value);
    const bmiInput = document.getElementById("bmi");

    if (h > 0 && w > 0) {
      const hM = h / 100;
      const bmi = (w / (hM * hM)).toFixed(1);
      bmiInput.value = bmi;
    } else {
      bmiInput.value = "";
    }
  }

  function calculateWHR() {
    const waist = parseFloat(document.getElementById("waist").value);
    const hip = parseFloat(document.getElementById("hip").value);
    const whrInput = document.getElementById("whr");

    if (waist > 0 && hip > 0) {
      const whr = (waist / hip).toFixed(2);
      whrInput.value = whr;
    } else {
      whrInput.value = "-";
    }
  }

  function renderHistoryTable(records) {
    const tbody = document.getElementById("historyTableBody");
    tbody.innerHTML = "";
    if (!records || records.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7">本期尚無登記紀錄</td></tr>';
      return;
    }
    records.forEach(r => {
      const tr = document.createElement("tr");
      const whrDisplay = (r.waist > 0 && r.hip > 0) ? (r.waist / r.hip).toFixed(2) : "-";
      tr.innerHTML = `
        <td>第 ${r.weekNumber} 週</td>
        <td>${r.recordDate}</td>
        <td>${r.weight} kg</td>
        <td>${r.bmi}</td>
        <td>${r.bodyFat}%</td>
        <td>${r.skeletalMuscle}%</td>
        <td>${whrDisplay}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function submitForm(e) {
    e.preventDefault();

    const heightVal = document.getElementById("height").value;
    if (!heightVal || parseFloat(heightVal) <= 0) {
      alert("請輸入有效的身高，才能精確計算 BMI 喔！");
      return;
    }

    const btn = document.getElementById("btnSubmit");
    btn.disabled = true;
    btn.innerText = "資料儲存中... 🌸";
    document.getElementById("statusMsg").innerText = "資料傳送中，請稍候...";

    const payload = {
      action: "save_health_data",
      operator_id: operatorId,
      user_id: document.getElementById("studentSelect").value,
      record_date: document.getElementById("recordDate").value,
      height: heightVal,
      weight: document.getElementById("weight").value,
      bodyFat: document.getElementById("bodyFat").value,
      skeletalMuscle: document.getElementById("skeletalMuscle").value,
      visceralFat: document.getElementById("visceralFat").value,
      bmr: document.getElementById("bmr").value,
      bodyAge: document.getElementById("bodyAge").value,
      waist: document.getElementById("waist").value,
      hip: document.getElementById("hip").value,
      memo: document.getElementById("memo").value
    };

    fetch(GAS_WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      btn.disabled = false;
      btn.innerText = "儲存當週數據 🌸";
      if (res.success) {
        document.getElementById("statusMsg").innerText = "✨ " + res.message;
        onStudentChange();
        setTimeout(() => {
          document.getElementById("historySection").scrollIntoView({ behavior: 'smooth' });
        }, 500);
      } else {
        document.getElementById("statusMsg").innerText = "❌ 儲存失敗：" + res.message;
      }
    })
    .catch(err => {
      btn.disabled = false;
      btn.innerText = "儲存當週數據 🌸";
      document.getElementById("statusMsg").innerText = "💥 發生錯誤，請稍後重試";
    });
  }

  // ====================================================
  // 🌸 IMPROVE: 管理員彈出視窗與對應開通期程 API 邏輯
  // ====================================================

  function openAdminModal() {
    document.getElementById("adminModal").style.display = "flex";
    document.getElementById("modalStatusMsg").innerText = "載入選單中...";
    
    // 設定開始日期為今天，並預設加 45 天為結束日期
    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];
    document.getElementById("modalStartDate").value = todayStr;
    autoCalcEndDate();

    // 1. 取得所有學員
    fetch(GAS_WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ action: "get_all_students", operator_id: operatorId })
    })
    .then(res => res.json())
    .then(res => {
      const mSelect = document.getElementById("modalStudentSelect");
      mSelect.innerHTML = "";
      if (res.success && res.data.length > 0) {
        res.data.forEach(s => {
          const opt = document.createElement("option");
          opt.value = s.LineID;
          opt.textContent = `${s.name} (${s.nickname || '無暱稱'})`;
          mSelect.appendChild(opt);
        });
      }
    });

    // 2. 取得所有教練
    fetch(GAS_WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ action: "get_coach_list" })
    })
    .then(res => res.json())
    .then(res => {
      const cSelect = document.getElementById("modalCoachSelect");
      cSelect.innerHTML = "";
      if (res.success && res.data.length > 0) {
        res.data.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c.LineID;
          opt.textContent = c.name;
          cSelect.appendChild(opt);
        });
        document.getElementById("modalStatusMsg").innerText = "";
      }
    });
  }

  function closeAdminModal() {
    document.getElementById("adminModal").style.display = "none";
  }

  function closeAdminModalOnOverlay(e) {
    if (e.target.id === "adminModal") {
      closeAdminModal();
    }
  }

  function autoCalcEndDate() {
    const startVal = document.getElementById("modalStartDate").value;
    if (!startVal) return;
    const startD = new Date(startVal.replace(/-/g, '/'));
    const endD = new Date(startD.getTime() + 45 * 24 * 60 * 60 * 1000);
    document.getElementById("modalEndDate").value = endD.toISOString().split('T')[0];
  }

  // 🌸 IMPROVE: 提交建立健管期程表單
  function submitAdminCreateCycle(e) {
    e.preventDefault();

    const targetUserId = document.getElementById("modalStudentSelect").value;
    const coachId = document.getElementById("modalCoachSelect").value;
    const startDate = document.getElementById("modalStartDate").value;
    const endDate = document.getElementById("modalEndDate").value;
    const targetWeight = document.getElementById("modalTargetWeight").value;
    const targetBodyFat = document.getElementById("modalTargetBodyFat").value;

    const btn = document.getElementById("btnAdminSubmit");
    btn.disabled = true;
    btn.innerText = "開通處理中... 🌸";
    document.getElementById("modalStatusMsg").innerText = "建立資料中，請稍候...";

    const payload = {
      action: "create_cycle_by_admin",
      operator_id: operatorId,
      user_id: targetUserId,
      coach_id: coachId,
      start_date: startDate,
      end_date: endDate,
      target_weight: targetWeight,
      target_body_fat: targetBodyFat
    };

    fetch(GAS_WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      btn.disabled = false;
      btn.innerText = "開通新健管期程 🌸";

      if (res.success) {
        alert("🎉 新健管期程已建立！可以開始記錄數據囉！");
        closeAdminModal();
        // 重新載入學員清單並自動選取該位新開通學員
        loadStudentList(targetUserId);
      } else {
        alert("⚠️ 建立失敗：" + res.message);
        document.getElementById("modalStatusMsg").innerText = "❌ " + res.message;
      }
    })
    .catch(err => {
      btn.disabled = false;
      btn.innerText = "開通新健管期程 🌸";
      alert("💥 建立時發生錯誤，請稍後重試");
    });
  }
</script>
