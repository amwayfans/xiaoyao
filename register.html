<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RichBoss健管 🌸 學員註冊表單</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #fdfbf7 0%, #fef5ee 50%, #fbe8e7 100%);
            color: #4a3b32;
        }
        .serif-title {
            font-family: 'Noto Serif TC', serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(243, 212, 201, 0.6);
            box-shadow: 0 20px 40px -15px rgba(212, 137, 106, 0.15);
        }
        .gradient-btn {
            background: linear-gradient(135deg, #e07a5f 0%, #d1495b 100%);
        }
        .gradient-btn:hover {
            background: linear-gradient(135deg, #c86349 0%, #b83748 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6">

    <!-- 主容器 -->
    <div class="w-full max-w-5xl glass-card rounded-3xl overflow-hidden shadow-2xl my-4 flex flex-col md:flex-row">
        
        <!-- 左側/上方：仙氣助教小妖歡迎視覺區塊 -->
        <div class="w-full md:w-5/12 bg-gradient-to-br from-rose-100/80 via-orange-50/80 to-amber-100/60 p-6 sm:p-8 flex flex-col justify-between items-center text-center border-b md:border-b-0 md:border-r border-rose-200/50 relative overflow-hidden">
            
            <!-- 背景裝飾文字 -->
            <div class="absolute -top-10 -left-10 text-9xl text-rose-200/20 font-serif select-none pointer-events-none">🌸</div>

            <!-- 標題與話術 -->
            <div class="space-y-3 z-10">
                <div class="inline-flex items-center gap-2 px-3 py-1 bg-white/80 rounded-full text-xs font-bold text-rose-600 shadow-sm border border-rose-200">
                    <i class="fa-solid fa-sparkles"></i> 歡迎加入RichBoss健管大家庭 🌸
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold serif-title text-rose-950 tracking-wide">
                    開啟您的<br><span class="text-rose-600">專屬健康美麗之旅</span>
                </h1>
                <p class="text-xs text-rose-800/80 leading-relaxed max-w-xs mx-auto">
                    填寫下方基本資料，讓仙氣助教小妖為您開通專屬健康護理檔案，陪伴您輕盈變美每一天✨
                </p>
            </div>

            <!-- 仙氣助教小妖形象與話術氣泡 -->
            <div class="my-6 z-10 w-full flex flex-col items-center">
                <!-- 對話氣泡 -->
                <div class="bg-white/90 p-3 rounded-2xl shadow-md border border-rose-200 mb-3 text-xs text-rose-900 font-medium max-w-xs relative">
                    <i class="fa-solid fa-quote-left text-rose-300 mr-1"></i>
                    嘻嘻！終於等到您囉！快完成註冊，仙氣助教小妖在這裡等您唷～啾咪🌸
                    <div class="w-3 h-3 bg-white border-b border-r border-rose-200 rotate-45 absolute -bottom-1.5 left-1/2 -translate-x-1/2"></div>
                </div>

                <!-- 仙氣助教小妖視覺圖片容器 -->
                <div class="w-48 h-48 sm:w-56 sm:h-56 rounded-2xl overflow-hidden shadow-lg border-2 border-white/80 relative group">
                    <img src="images/xiaoyao-welcome.png" 
                         onerror="this.src='https://amwayfans.github.io/xiaoyao/images/xiaoyao-welcome.png'" 
                         alt="仙氣助教小妖開心歡迎" class="w-full h-full object-cover object-top transition-transform duration-500 group-hover:scale-105">
                </div>
            </div>

            <!-- 底部小提醒 -->
            <div class="text-[11px] text-stone-500 z-10 flex items-center gap-1.5">
                <i class="fa-solid fa-shield-halved text-emerald-600"></i>
                <span>您的個人資料受仙氣助教小妖隱私安全機制防護</span>
            </div>
        </div>

        <!-- 右側/下方：註冊表單區塊 -->
        <div class="w-full md:w-7/12 p-6 sm:p-10 bg-white/60 flex flex-col justify-center">
            
            <div class="mb-6 border-b border-rose-100 pb-4">
                <h2 class="text-xl font-bold text-stone-800 flex items-center gap-2">
                    <i class="fa-solid fa-file-pen text-rose-500"></i> 學員註冊表單
                </h2>
                <p class="text-xs text-stone-500 mt-1">標註 <span class="text-rose-500 font-bold">*</span> 為必填欄位</p>
            </div>

            <form id="registrationForm" class="space-y-4">
                
                <!-- LineID (自動帶入且反灰唯讀) -->
                <div>
                    <label class="block text-xs font-bold text-stone-700 mb-1" for="lineIdInput">
                        <span class="text-rose-500 mr-0.5">*</span>LineID
                    </label>
                    <input type="text" id="lineIdInput" required readonly placeholder="請輸入您的 LineID" 
                           class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-stone-300 bg-stone-100 text-stone-500 cursor-not-allowed focus:outline-none shadow-sm transition-all">
                </div>

                <!-- 啟用日期 (自動帶入且反灰唯讀) -->
                <div>
                    <label class="block text-xs font-bold text-stone-700 mb-1" for="startDateInput">
                        <span class="text-rose-500 mr-0.5">*</span>啟用日期
                    </label>
                    <input type="date" id="startDateInput" required readonly 
                           class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-stone-300 bg-stone-100 text-stone-500 cursor-not-allowed focus:outline-none shadow-sm transition-all">
                </div>

                <!-- 學員姓名 -->
                <div>
                    <label class="block text-xs font-bold text-stone-700 mb-1" for="userNameInput">
                        <span class="text-rose-500 mr-0.5">*</span>學員姓名
                    </label>
                    <input type="text" id="userNameInput" required placeholder="請輸入您的真實姓名" 
                           class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-rose-400 bg-white/90 shadow-sm transition-all">
                </div>

                <!-- Line暱稱 -->
                <div>
                    <label class="block text-xs font-bold text-stone-700 mb-0.5" for="nicknameInput">
                        <span class="text-rose-500 mr-0.5">*</span>Line暱稱
                    </label>
                    <p class="text-[11px] text-stone-400 mb-1">希望仙氣助教小妖怎麼稱呼您呢</p>
                    <input type="text" id="nicknameInput" required placeholder="請輸入您希望的暱稱" 
                           class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-rose-400 bg-white/90 shadow-sm transition-all">
                </div>

                <!-- 性別 -->
                <div>
                    <label class="block text-xs font-bold text-stone-700 mb-1" for="genderSelect">
                        <span class="text-rose-500 mr-0.5">*</span>性別
                    </label>
                    <select id="genderSelect" required 
                            class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-rose-400 bg-white/90 shadow-sm transition-all text-stone-700">
                        <option value="" disabled selected>請選擇選項</option>
                        <option value="女">女</option>
                        <option value="男">男</option>
                    </select>
                </div>

                <!-- 生日 -->
                <div>
                    <label class="block text-xs font-bold text-stone-700 mb-0.5" for="birthdayInput">
                        <span class="text-rose-500 mr-0.5">*</span>生日
                    </label>
                    <p class="text-[11px] text-stone-400 mb-1">計算年齡使用</p>
                    <input type="date" id="birthdayInput" required 
                           class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-rose-400 bg-white/90 shadow-sm transition-all">
                </div>

                <!-- 電子信箱 -->
                <div>
                    <label class="block text-xs font-bold text-stone-700 mb-0.5" for="emailInput">
                        <span class="text-rose-500 mr-0.5">*</span>電子信箱
                    </label>
                    <p class="text-[11px] text-stone-400 mb-1">後續產生報告，會寄至您信箱唷</p>
                    <input type="email" id="emailInput" required placeholder="example@gmail.com" 
                           class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-rose-400 bg-white/90 shadow-sm transition-all">
                </div>

                <!-- 提交按鈕 -->
                <div class="pt-4">
                    <button type="submit" id="submitBtn" 
                            class="w-full gradient-btn text-white font-bold py-3.5 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 flex items-center justify-center gap-2 text-base">
                        <i class="fa-solid fa-paper-plane"></i> 提交註冊資料
                    </button>
                </div>

            </form>

            <!-- 成功訊息遮罩（預設隱藏） -->
            <div id="successOverlay" class="hidden mt-6 bg-emerald-50 border border-emerald-200 p-6 rounded-2xl text-center space-y-3">
                <i class="fa-solid fa-circle-check text-emerald-500 text-4xl"></i>
                <h3 class="text-lg font-bold text-emerald-950">註冊成功囉！🌸</h3>
                <p class="text-xs text-emerald-800 leading-relaxed">
                    仙氣助教小妖已經成功將您的個人檔案同步至 Lark 健康資料庫囉！<br>請回到 LINE 聊天室，仙氣助教小妖已經為您準備好專屬關懷囉～✨
                </p>
            </div>

        </div>

    </div>

    <script>
        // 後端 Google Apps Script Webhook 網址
        const gasWebhookUrl = "https://script.google.com/macros/s/AKfycbw4SepToEB3DoVPutFIX183Cine0GxYJVquDh8119eRDpPlpXLvFY_cT-DReGA91sxY/exec";

        document.addEventListener("DOMContentLoaded", () => {
            // 1. 自動填入今天日期至「啟用日期」
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('startDateInput').value = todayStr;

            // 2. 自動抓取 URL 參數預填 LineID
            const urlParams = new URLSearchParams(window.location.search);
            const prefillLineId = urlParams.get('prefill_LineID') || urlParams.get('LineID') || urlParams.get('userId') || "";
            if (prefillLineId) {
                document.getElementById('lineIdInput').value = prefillLineId;
            }

            // 3. 表單提交事件處理
            const form = document.getElementById('registrationForm');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = true;
                submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> 註冊資料處理中...`;

                const payloadData = {
                    action: "register_user",
                    LineID: document.getElementById('lineIdInput').value.trim(),
                    startDate: document.getElementById('startDateInput').value,
                    userName: document.getElementById('userNameInput').value.trim(),
                    nickname: document.getElementById('nicknameInput').value.trim(),
                    gender: document.getElementById('genderSelect').value,
                    birthday: document.getElementById('birthdayInput').value,
                    email: document.getElementById('emailInput').value.trim()
                };

                try {
                    await fetch(gasWebhookUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        cache: 'no-cache',
                        redirect: 'follow',
                        body: JSON.stringify(payloadData)
                    });

                    // 顯示成功狀態
                    form.classList.add('hidden');
                    document.getElementById('successOverlay').classList.remove('hidden');

                } catch (err) {
                    alert("提交過程發生網路異常，請稍後重試！");
                    console.error("註冊提交出錯:", err);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane mr-2"></i> 提交註冊資料`;
                }
            });
        });
    </script>
</body>
</html>
