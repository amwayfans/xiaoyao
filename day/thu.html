<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>週四｜休息</title>
<style>
  :root { --bg:#12141A; --fg:#E8EAED; --dim:#8A8F98; --accent:#4A4F58; }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px 18px 40px; background:var(--bg); color:var(--fg);
         font-family:-apple-system,"Noto Sans TC","PingFang TC",sans-serif;
         font-size:17px; line-height:1.6; }
  h1 { font-size:26px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:14px; margin-bottom:22px; }
  .row { background:#1B1E26; border-radius:14px; padding:14px 16px; margin-bottom:10px; }
  .row .top { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .row .no { color:var(--accent); font-weight:700; font-size:14px; min-width:34px; }
  .row .name { font-size:19px; font-weight:600; flex:1; }
  .row .wt { font-size:19px; font-weight:700; color:var(--accent); white-space:nowrap; }
  .row .sr { color:var(--dim); font-size:15px; margin-top:2px; }
  .row .why { color:#9CA3AF; font-size:13px; margin-top:6px; }
  .tip { background:#1B1E26; border-left:3px solid var(--accent); border-radius:8px;
          padding:12px 14px; margin:16px 0; font-size:15px; color:var(--dim); }
  .tip b { color:var(--fg); }
  a.back { display:inline-block; margin-top:26px; color:var(--accent); text-decoration:none;
            font-size:15px; }
  .rest { font-size:20px; margin:30px 0 10px; }
</style>
</head>
<body>
<h1>週四｜休息</h1>
<div class="sub">Block 1・恢復日</div>
<div class="rest">今天休息。</div>
<div class="tip"><b>恢復也是訓練</b>：走路 20–30 分、髖與胸椎活動度、睡前不滑手機</div>
<div class="tip"><b>可以做</b>：輕度核心（棒式 2 組 30 秒）、伸展、熱敷</div>
<div class="tip"><b>不要做</b>：補練昨天沒做完的動作 —— 那會打亂下一場的恢復</div>
<div class="tip"><b>下次練前</b>：確認睡眠與食慾，這兩項比任何補劑都影響表現</div>
<a class="back" href="https://t.me/">← 回小妖</a>
</body>
</html>
