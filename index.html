                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
                }
            } catch (e) {}
        }

        function resolveLineId() {
            const urlParams = new URLSearchParams(window.location.search);
            currentLineId = urlParams.get('prefill_LineID') || urlParams.get('LineID') || urlParams.get('userId') || "";
            const displayEl = document.getElementById('displayLineId');
            const manualBtn = document.getElementById('manualInputBtn');

            if (currentLineId && currentLineId.trim() !== "") {
                displayEl.innerText = currentLineId;
                displayEl.className = "font-mono text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded text-xs";
                manualBtn.classList.add('hidden');
            } else {
                currentLineId = "未綁定LINE帳號";
                displayEl.innerText = "未檢測到帳號";
                displayEl.className = "font-mono text-amber-700 bg-amber-100 px-2 py-0.5 rounded text-xs font-bold";
                manualBtn.classList.remove('hidden');
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            resolveLineId();
            initTabs();
            renderSymptoms();

            document.getElementById("searchInput").addEventListener("input", renderSymptoms);

            document.getElementById("manualInputBtn").onclick = () => {
                playSound('click');
                const input = prompt("請輸入您的 LINE 帳號 ID (以 U 開頭):", "U");
                if (input && input.trim() !== "") {
                    currentLineId = input.trim();
                    document.getElementById('displayLineId').innerText = currentLineId;
                    document.getElementById('displayLineId').className = "font-mono text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded text-xs";
                    document.getElementById('manualInputBtn').classList.add('hidden');
                }
            };

            document.getElementById("resetBtn").onclick = () => {
                playSound('click');
                if (selectedSymptomIds.size > 0 && confirm("確定要清空所有已勾選的症狀嗎？")) {
                    selectedSymptomIds.clear();
                    document.getElementById("selectedCount").innerText = 0;
                    renderSymptoms();
                    document.getElementById("reportSection").classList.add("hidden");
                }
            };

            document.getElementById("analyzeBtn").onclick = submitAndAnalyze;
        });

        function initTabs() {
            const categories = ["全部分類", ...new Set(dbData.map(item => item.category))];
            const tabsContainer = document.getElementById("categoryTabs");
            tabsContainer.innerHTML = "";
            categories.forEach(cat => {
                const btn = document.createElement("button");
                btn.className = `tab-btn border border-slate-300 px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all hover:bg-slate-200 text-slate-700 ${cat === currentCategory ? 'active' : ''}`;
                btn.innerText = cat;
                btn.onclick = () => {
                    playSound('click');
                    currentCategory = cat;
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderSymptoms();
                };
                tabsContainer.appendChild(btn);
            });
        }

        function renderSymptoms() {
            const grid = document.getElementById("symptomsGrid");
            const searchKeyword = document.getElementById("searchInput").value.trim().toLowerCase();
            grid.innerHTML = "";

            const filtered = dbData.filter(item => {
                const matchCat = currentCategory === "全部分類" || item.category === currentCategory;
                const matchKey = item.symptom.toLowerCase().includes(searchKeyword);
                return matchCat && matchKey;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400"><p class="text-sm">查無符合條件的症狀</p></div>`;
                return;
            }

            filtered.forEach(item => {
                const isChecked = selectedSymptomIds.has(item.id);
                const card = document.createElement("div");
                card.className = `checkbox-card cursor-pointer border rounded-xl p-3 flex items-center justify-between bg-white hover:border-emerald-300 transition-all ${isChecked ? 'checked' : 'border-slate-200'}`;
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-4 h-4 rounded border ${isChecked ? 'bg-emerald-600 border-emerald-600 text-white' : 'border-slate-300 bg-slate-50'} flex items-center justify-center text-[10px]">
                            ${isChecked ? '✓' : ''}
                        </div>
                        <div>
                            <span class="text-[10px] px-1 py-0.2 rounded bg-slate-100 text-slate-500 font-mono mr-1">${item.category}</span>
                            <span class="text-xs font-medium text-slate-800">${item.symptom}</span>
                        </div>
                    </div>
                `;
                card.onclick = () => {
                    playSound('click');
                    if (selectedSymptomIds.has(item.id)) selectedSymptomIds.delete(item.id);
                    else selectedSymptomIds.add(item.id);
                    document.getElementById("selectedCount").innerText = selectedSymptomIds.size;
                    renderSymptoms();
                };
                grid.appendChild(card);
            });
        }

        async function submitAndAnalyze() {
            if (selectedSymptomIds.size === 0) { alert("請至少勾選一項症狀喔！"); return; }

            const analyzeBtn = document.getElementById("analyzeBtn");
            analyzeBtn.disabled = true;
            analyzeBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 資料上傳中...`;

            playSound('success');

            const counts = {};
            const selectedSymptomsList = [];
            selectedSymptomIds.forEach(id => {
                const item = dbData.find(d => d.id === id);
                if (item) {
                    selectedSymptomsList.push(item.symptom);
                    item.nutrients.forEach(n => counts[n] = (counts[n] || 0) + 1);
                }
            });

            const sortedNutrients = Object.keys(counts).map(k => ({ name: nutrientNameMap[k] || k, count: counts[k] })).sort((a,b) => b.count - a.count);
            const top3Names = sortedNutrients.slice(0, 3).map(n => n.name).join(", ");
            const fullStatsText = sortedNutrients.map(n => `${n.name}: ${n.count}次`).join(", ");

            renderTop3UI(sortedNutrients.slice(0, 3));
            renderFullStatUI(sortedNutrients);
            document.getElementById("reportSection").classList.remove("hidden");
            document.getElementById("reportSection").scrollIntoView({ behavior: 'smooth' });

            const payloadData = {
                action: "save_subhealth_survey",
                LineID: currentLineId,
                symptomCount: selectedSymptomIds.size,
                symptomsDetail: selectedSymptomsList.join(", "),
                top3Nutrients: top3Names,
                fullStatsText: fullStatsText
            };

            // 🌸 關鍵修復：使用 mode: 'no-cors' 避免 GAS CORS 跨網域請求被擋掉
            try {
                await fetch(gasWebhookUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    redirect: 'follow',
                    body: JSON.stringify(payloadData)
                });
                console.log("問卷數據已成功送出至 GAS Webhook！");
            } catch (e) {
                console.error("提交至 GAS 出錯:", e);
            } finally {
                analyzeBtn.disabled = false;
                analyzeBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> 完成檢測並儲存至小妖健康檔案`;
            }
        }

        function renderTop3UI(top3) {
            const container = document.getElementById("top3Container");
            container.innerHTML = "";
            top3.forEach((item, idx) => {
                const card = document.createElement("div");
                card.className = "bg-white border-2 border-amber-400 p-4 rounded-xl text-center shadow-md relative overflow-hidden";
                card.innerHTML = `
                    <div class="absolute top-0 right-0 bg-gradient-to-l from-amber-500 to-orange-500 text-white text-[10px] font-bold px-3 py-1 rounded-bl-lg shadow-sm">
                        🚨 優先補充 No.${idx+1}
                    </div>
                    <h4 class="font-bold text-amber-950 text-base mt-3">${item.name}</h4>
                    <p class="text-xs text-slate-600 mt-1">關聯症狀數：<strong class="text-amber-700 text-sm font-mono">${item.count}</strong> 項</p>
                    <div class="mt-2 pt-2 border-t border-amber-100 text-[10px] text-amber-800 font-medium">
                        建議每日優先著重補充
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderFullStatUI(sortedNutrients) {
            const container = document.getElementById("fullStatContainer");
            container.innerHTML = "";
            sortedNutrients.forEach(item => {
                const tag = document.createElement("span");
                tag.className = "text-[11px] bg-white border border-slate-200 px-2.5 py-1 rounded-md text-slate-600 shadow-sm";
                tag.innerHTML = `${item.name} <strong class="text-emerald-600">${item.count}次</strong>`;
                container.appendChild(tag);
            });
        }
    </script>
</body>
</html>
